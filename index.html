<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACRO MOTORS · 아크로 공업사 차량 입고·정비 관리</title>
<style>
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-2: #f9fafb;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #111827;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --ok: #059669;
    --ok-soft: #ecfdf5;
    --warn: #d97706;
    --warn-soft: #fffbeb;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 2px 10px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  .app-wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 12px;
    padding-bottom: 80px;
  }
  .top-header, .stat-card, .filter-card, .v-card, .empty-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .top-header { padding: 12px; margin-bottom: 12px; }
  .brand-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .acro-box {
    background: #111827;
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    text-align: center;
    line-height: 1.1;
    flex-shrink: 0;
  }
  .acro-box .en { display: block; font-weight: 900; font-size: 14px; letter-spacing: 0.06em; color: #ef4444; }
  .acro-box .sub { display: block; font-weight: 700; font-size: 9px; letter-spacing: 0.12em; color: #e5e7eb; margin-top: 2px; }
  .brand-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .brand-name { font-size: 16px; font-weight: 800; }
  .pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .pill.mode { background: var(--accent-soft); color: var(--accent); border: 1px solid #bfdbfe; }
  .pill.partner { background: var(--warn-soft); color: var(--warn); border: 1px solid #fde68a; }
  .pill.sync { background: var(--ok-soft); color: var(--ok); border: 1px solid #a7f3d0; }
  .pill.type { background: #f3f4f6; color: #374151; }
  .pill.st-wait { background: #fff7ed; color: #c2410c; }
  .pill.st-work { background: #eff6ff; color: #1d4ed8; }
  .pill.st-done { background: #ecfdf5; color: #047857; }
  .brand-desc { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }

  .btn-row-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-bottom: 7px; }
  .btn-row-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  button, select, input, textarea { font-family: inherit; font-size: 14px; }
  button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-weight: 700;
    cursor: pointer;
    min-height: 42px;
    font-size: 12.5px;
  }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  button.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.soft { background: #f3f4f6; color: #1f2937; }
  button.danger { background: var(--danger-soft); color: var(--danger); border-color: #fecaca; }
  button.small { min-height: 34px; padding: 4px 8px; font-size: 12px; }

  input, select, textarea {
    width: 100%;
    border: 1px solid #d1d5db;
    background: #fff;
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    min-height: 40px;
  }
  textarea { min-height: 66px; resize: vertical; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  @media (min-width: 720px) { .stats-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .stat-card { padding: 12px; cursor: pointer; }
  .stat-card.active { border: 1.5px solid var(--accent); background: #f8faff; }
  .stat-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .stat-num { font-size: 22px; font-weight: 800; }

  .filter-card { padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
  .filter-row.two { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 640px) { .filter-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .filter-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .link-btn { background: none; border: none; min-height: 30px; padding: 2px 6px; color: var(--accent); font-size: 12px; }

  .vehicle-list { display: flex; flex-direction: column; gap: 10px; }
  .v-card { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .v-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .v-plate { font-size: 19px; font-weight: 900; margin-top: 4px; }
  .v-model { font-size: 13px; color: var(--muted); font-weight: 600; }
  .v-meta { display: grid; grid-template-columns: 1fr; gap: 4px; font-size: 12.5px; background: var(--surface-2); padding: 8px 10px; border-radius: var(--radius-sm); }
  @media (min-width: 640px) { .v-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .photo-box { background: var(--surface-2); border: 1px dashed #cbd5e1; border-radius: var(--radius-sm); padding: 10px; margin-bottom: 10px; }
  .photo-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .photo-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .photo-card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .thumb-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .thumb-row img { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  .v-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    z-index: 9999;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    background: var(--surface);
    border-radius: var(--radius);
    width: 100%;
    max-width: 720px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 16px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 12px; }
  .modal-title { margin: 0; font-size: 16px; font-weight: 800; }
  .form-group { margin-bottom: 10px; }
  .form-label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
  .empty-box { padding: 24px; text-align: center; color: var(--muted); }

  .code-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .code-table th, .code-table td { border: 1px solid var(--line); padding: 7px 8px; text-align: left; }
  .code-table th { background: var(--surface-2); font-weight: 700; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: #111827;
    color: #fff;
    padding: 9px 15px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    display: none;
    z-index: 10000;
  }
  .toast.show { display: block; }
</style>
</head>
<body>
<div class="app-wrap">
  <header class="top-header">
    <div class="brand-top">
      <div class="acro-box">
        <span class="en">ACRO</span>
        <span class="sub">MOTORS</span>
      </div>
      <div>
        <div class="brand-title-row">
          <span class="brand-name">아크로 공업사</span>
          <span id="modeBadge" class="pill mode">관리자 모드</span>
          <span id="syncBadge" class="pill sync">연결 준비됨</span>
        </div>
        <p class="brand-desc">수입·국산 종합정비 · 판금·열처리 도장 · 보험수리 · 대차 관리</p>
      </div>
    </div>

    <div class="btn-row-3">
      <button type="button" id="btnAdminMode" class="primary">👤 관리자 모드</button>
      <button type="button" id="btnPartnerMode" class="soft">🏢 거래처 모드</button>
      <button type="button" id="btnSyncModal" class="soft">☁️ 동기화·불러오기</button>
    </div>
    <div class="btn-row-2">
      <button type="button" id="btnSaveHtml" class="soft">💾 .html 저장</button>
      <button type="button" id="btnNewVehicle" class="accent">+ 신규 차량 입고</button>
    </div>
  </header>

  <section class="stats-grid">
    <div class="stat-card active" data-status="ALL">
      <div class="stat-top"><span>전체 차량</span><span>🚗</span></div>
      <div class="stat-num" id="cntAll">0</div>
    </div>
    <div class="stat-card" data-status="입고·견적 대기">
      <div class="stat-top"><span>입고·견적 대기</span><span>⏳</span></div>
      <div class="stat-num" id="cntWait">0</div>
    </div>
    <div class="stat-card" data-status="판금 진행">
      <div class="stat-top"><span>판금 진행</span><span>🔨</span></div>
      <div class="stat-num" id="cntMetal">0</div>
    </div>
    <div class="stat-card" data-status="도장 진행">
      <div class="stat-top"><span>도장 진행</span><span>🎨</span></div>
      <div class="stat-num" id="cntPaint">0</div>
    </div>
    <div class="stat-card" data-status="출고 대기·완료">
      <div class="stat-top"><span>출고 대기·완료</span><span>✅</span></div>
      <div class="stat-num" id="cntDone">0</div>
    </div>
  </section>

  <section class="filter-card">
    <input type="text" id="searchInput" placeholder="🔍 차량번호, 차종, 고객명, 보험사, 접수번호, 담당자 검색">
    <div class="filter-row two">
      <select id="partnerFilter"></select>
      <select id="statusFilterSelect">
        <option value="ALL">공정 상태: 전체</option>
        <option value="입고·견적 대기">입고·견적 대기</option>
        <option value="판금 진행">판금 진행</option>
        <option value="도장 진행">도장 진행</option>
        <option value="출고 대기·완료">출고 대기·완료</option>
      </select>
    </div>
    <div class="filter-footer">
      <span id="resultCount">조회된 차량: 0대</span>
      <button type="button" id="btnResetFilter" class="link-btn">필터 초기화</button>
    </div>
  </section>

  <main id="vehicleList" class="vehicle-list"></main>
</div>

<!-- 차량 등록/수정 모달 -->
<div id="vehicleModal" class="modal-backdrop">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="vehicleModalTitle" class="modal-title">신규 차량 입고</h3>
      <button type="button" class="small" data-close="vehicleModal">닫기 ✕</button>
    </div>
    <form id="vehicleForm">
      <input type="hidden" id="editId">
      <div class="filter-row two form-group">
