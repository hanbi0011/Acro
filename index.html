<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACRO MOTORS · 아크로 공업사 차량 입고·정비 관리</title>
<style>
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-2: #f9fafb;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #111827;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --ok: #059669;
    --ok-soft: #ecfdf5;
    --warn: #d97706;
    --warn-soft: #fffbeb;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 2px 10px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  .app-wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 12px;
    padding-bottom: 80px;
  }
  .top-header, .stat-card, .filter-card, .v-card, .empty-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .top-header { padding: 12px; margin-bottom: 12px; }
  .brand-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .acro-box {
    background: #111827;
    color: #fff;
    padding: 6px 10px;
    border-radius: 8px;
    text-align: center;
    line-height: 1.1;
    flex-shrink: 0;
  }
  .acro-box .en { display: block; font-weight: 900; font-size: 14px; letter-spacing: 0.06em; color: #ef4444; }
  .acro-box .sub { display: block; font-weight: 700; font-size: 9px; letter-spacing: 0.12em; color: #e5e7eb; margin-top: 2px; }
  .brand-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .brand-name { font-size: 16px; font-weight: 800; }
  .pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .pill.mode { background: var(--accent-soft); color: var(--accent); border: 1px solid #bfdbfe; }
  .pill.partner { background: var(--warn-soft); color: var(--warn); border: 1px solid #fde68a; }
  .pill.sync { background: var(--ok-soft); color: var(--ok); border: 1px solid #a7f3d0; }
  .pill.type { background: #f3f4f6; color: #374151; }
  .pill.st-wait { background: #fff7ed; color: #c2410c; }
  .pill.st-work { background: #eff6ff; color: #1d4ed8; }
  .pill.st-done { background: #ecfdf5; color: #047857; }
  .brand-desc { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); }

  .btn-row-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-bottom: 7px; }
  .btn-row-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  button, select, input, textarea { font-family: inherit; font-size: 14px; }
  button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-weight: 700;
    cursor: pointer;
    min-height: 42px;
    font-size: 12.5px;
  }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  button.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.soft { background: #f3f4f6; color: #1f2937; }
  button.danger { background: var(--danger-soft); color: var(--danger); border-color: #fecaca; }
  button.small { min-height: 34px; padding: 4px 8px; font-size: 12px; }

  input, select, textarea {
    width: 100%;
    border: 1px solid #d1d5db;
    background: #fff;
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    min-height: 40px;
  }
  textarea { min-height: 70px; resize: vertical; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  @media (min-width: 720px) { .stats-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .stat-card { padding: 12px; cursor: pointer; }
  .stat-card.active { border: 1.5px solid var(--accent); background: #f8faff; }
  .stat-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .stat-num { font-size: 22px; font-weight: 800; }

  .filter-card { padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
  .filter-row.two { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 640px) { .filter-row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .filter-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .link-btn { background: none; border: none; min-height: 30px; padding: 2px 6px; color: var(--accent); font-size: 12px; }

  .vehicle-list { display: flex; flex-direction: column; gap: 10px; }
  .v-card { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .v-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .v-plate { font-size: 19px; font-weight: 900; margin-top: 4px; }
  .v-model { font-size: 13px; color: var(--muted); font-weight: 600; }
  .v-meta { display: grid; grid-template-columns: 1fr; gap: 4px; font-size: 12.5px; background: var(--surface-2); padding: 8px 10px; border-radius: var(--radius-sm); }
  @media (min-width: 640px) { .v-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .v-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 640px) { .v-actions { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    z-index: 9999;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    background: var(--surface);
    border-radius: var(--radius);
    width: 100%;
    max-width: 580px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 16px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 12px; }
  .modal-title { margin: 0; font-size: 16px; font-weight: 800; }
  .form-group { margin-bottom: 10px; }
  .form-label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
  .empty-box { padding: 24px; text-align: center; color: var(--muted); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: #111827;
    color: #fff;
    padding: 9px 15px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    display: none;
    z-index: 10000;
  }
  .toast.show { display: block; }
</style>
</head>
<body>
<div class="app-wrap">
  <header class="top-header">
    <div class="brand-top">
      <div class="acro-box">
        <span class="en">ACRO</span>
        <span class="sub">MOTORS</span>
      </div>
      <div>
        <div class="brand-title-row">
          <span class="brand-name">아크로 공업사</span>
          <span id="modeBadge" class="pill mode">관리자 모드</span>
          <span id="syncBadge" class="pill sync">연결 준비됨</span>
        </div>
        <p class="brand-desc">수입·국산 종합정비 · 판금·열처리 도장 · 보험수리 · 대차 관리</p>
      </div>
    </div>

    <div class="btn-row-3">
      <button type="button" id="btnAdminMode" class="primary">👤 관리자 모드</button>
      <button type="button" id="btnPartnerMode" class="soft">🏢 거래처 모드</button>
      <button type="button" id="btnSyncModal" class="soft">☁️ 동기화·불러오기</button>
    </div>
    <div class="btn-row-2">
      <button type="button" id="btnSaveHtml" class="soft">💾 .html 저장</button>
      <button type="button" id="btnNewVehicle" class="accent">+ 신규 차량 입고</button>
    </div>
  </header>

  <section class="stats-grid">
    <div class="stat-card active" data-status="ALL">
      <div class="stat-top"><span>전체 차량</span><span>🚗</span></div>
      <div class="stat-num" id="cntAll">0</div>
    </div>
    <div class="stat-card" data-status="입고·견적 대기">
      <div class="stat-top"><span>입고·견적 대기</span><span>⏳</span></div>
      <div class="stat-num" id="cntWait">0</div>
    </div>
    <div class="stat-card" data-status="판금 진행">
      <div class="stat-top"><span>판금 진행</span><span>🔨</span></div>
      <div class="stat-num" id="cntMetal">0</div>
    </div>
    <div class="stat-card" data-status="도장 진행">
      <div class="stat-top"><span>도장 진행</span><span>🎨</span></div>
      <div class="stat-num" id="cntPaint">0</div>
    </div>
    <div class="stat-card" data-status="출고 대기·완료">
      <div class="stat-top"><span>출고 대기·완료</span><span>✅</span></div>
      <div class="stat-num" id="cntDone">0</div>
    </div>
  </section>

  <section class="filter-card">
    <input type="text" id="searchInput" placeholder="🔍 차량번호, 차종, 고객명, 보험사, 담당자 검색">
    <div class="filter-row two">
      <select id="partnerFilter"></select>
      <select id="statusFilterSelect">
        <option value="ALL">공정 상태: 전체</option>
        <option value="입고·견적 대기">입고·견적 대기</option>
        <option value="판금 진행">판금 진행</option>
        <option value="도장 진행">도장 진행</option>
        <option value="출고 대기·완료">출고 대기·완료</option>
      </select>
    </div>
    <div class="filter-footer">
      <span id="resultCount">조회된 차량: 0대</span>
      <button type="button" id="btnResetFilter" class="link-btn">필터 초기화</button>
    </div>
  </section>

  <main id="vehicleList" class="vehicle-list"></main>
</div>

<!-- 차량 등록/수정 모달 -->
<div id="vehicleModal" class="modal-backdrop">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="vehicleModalTitle" class="modal-title">신규 차량 입고</h3>
      <button type="button" class="small" data-close="vehicleModal">닫기 ✕</button>
    </div>
    <form id="vehicleForm">
      <input type="hidden" id="editId">
      <div class="filter-row two form-group">
        <div>
          <label class="form-label">의뢰 거래처 *</label>
          <select id="fPartner"></select>
        </div>
        <div>
          <label class="form-label">입고 구분</label>
          <select id="fType">
            <option value="보험수리">보험수리</option>
            <option value="일반정비">일반정비</option>
            <option value="판금·도장">판금·도장</option>
            <option value="출고점검">출고점검</option>
          </select>
        </div>
      </div>
      <div class="filter-row two form-group">
        <div>
          <label class="form-label">차량번호 *</label>
          <input type="text" id="fPlate" required placeholder="예: 219하 4410">
        </div>
        <div>
          <label class="form-label">차종 *</label>
          <input type="text" id="fModel" required placeholder="예: BYD 아토 3">
        </div>
      </div>
      <div class="filter-row two form-group">
        <div>
          <label class="form-label">고객명</label>
          <input type="text" id="fCustomer" placeholder="예: 홍길동">
        </div>
        <div>
          <label class="form-label">연락처</label>
          <input type="text" id="fPhone" placeholder="예: 010-1234-5678">
        </div>
      </div>
      <div class="filter-row two form-group">
        <div>
          <label class="form-label">보험사</label>
          <input type="text" id="fInsurance" placeholder="예: 삼성화재">
        </div>
        <div>
          <label class="form-label">공정 상태</label>
          <select id="fStatus">
            <option value="입고·견적 대기">입고·견적 대기</option>
            <option value="판금 진행">판금 진행</option>
            <option value="도장 진행">도장 진행</option>
            <option value="출고 대기·완료">출고 대기·완료</option>
          </select>
        </div>
      </div>
      <div class="filter-row two form-group">
        <div>
          <label class="form-label">담당자</label>
          <input type="text" id="fTech" placeholder="예: 판금부 최성윤 팀장">
        </div>
        <div>
          <label class="form-label">출고 예정일</label>
          <input type="date" id="fDueDate">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">정비 메모</label>
        <textarea id="fMemo" placeholder="파손 부위 및 정비 내용을 입력하세요"></textarea>
      </div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button type="button" data-close="vehicleModal">취소</button>
        <button type="submit" class="primary">저장하기</button>
      </div>
    </form>
  </div>
</div>

<!-- 거래처 모드 모달 -->
<div id="partnerModal" class="modal-backdrop">
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="modal-title">거래처 모드 선택</h3>
      <button type="button" class="small" data-close="partnerModal">닫기 ✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">거래처 선택</label>
      <select id="partnerSelectModal"></select>
    </div>
    <button type="button" id="btnApplyPartner" class="accent" style="width:100%;">선택한 거래처만 보기</button>
  </div>
</div>

<!-- 동기화 설정 모달 -->
<div id="syncModal" class="modal-backdrop">
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="modal-title">구글 시트 동기화</h3>
      <button type="button" class="small" data-close="syncModal">닫기 ✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Apps Script 웹 앱 URL (/exec)</label>
      <input type="text" id="endpointInput">
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button type="button" id="btnSaveEndpoint" class="primary small">주소 저장</button>
      <button type="button" id="btnPullSheet" class="small">시트 데이터 불러오기</button>
      <button type="button" id="btnPushSheet" class="small">시트에 내보내기</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function() {
  var ENDPOINT_DEFAULT = 'https://script.google.com/macros/s/AKfycbyIckCGYOdiNi2-gIb60HfFcqJ8JuNudQpjPxbJIxkfXGSxo04m0dzVvtnzUZHS1oRL/exec';
  var PARTNERS = ['청주 BYD', '대전 BYD', '대전 지프', '안수상', '정재식', '119렉카', '스피드메이트', '케이카', '일반 개인고객', '기타 협력 거래처'];

  var vehicles = [
    {
      id: 'v-1001',
      partner: '청주 BYD',
      type: '판금·도장',
      plate: '219하 4410',
      model: 'BYD 아토 3',
      customer: '박준호',
      phone: '010-5512-9081',
      insurance: '삼성화재',
      status: '도장 진행',
      tech: '도장부 강신철',
      dueDate: '2026-11-26',
      memo: '열처리 도장 공정 진행 중'
    }
  ];

  var role = 'ADMIN';
  var activePartner = '';
  var statusFilter = 'ALL';
  var endpoint = ENDPOINT_DEFAULT;

  function $(id) { return document.getElementById(id); }

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast show';
    clearTimeout(toast._t);
    toast._t = setTimeout(function() { el.className = 'toast'; }, 2400);
  }

  function openModal(id) {
    var el = $(id);
    if (el) el.className = 'modal-backdrop open';
  }

  function closeModal(id) {
    var el = $(id);
    if (el) el.className = 'modal-backdrop';
  }

  function fillPartnerSelects() {
    var pFilter = $('partnerFilter');
    var fPartner = $('fPartner');
    var pModal = $('partnerSelectModal');

    var htmlAll = '<option value="ALL">거래처: 전체</option>' + PARTNERS.map(function(p) {
      return '<option value="' + p + '">' + p + '</option>';
    }).join('');
    var htmlOnly = PARTNERS.map(function(p) {
      return '<option value="' + p + '">' + p + '</option>';
    }).join('');

    if (role === 'PARTNER' && activePartner) {
      pFilter.innerHTML = '<option value="' + activePartner + '">' + activePartner + '</option>';
      pFilter.disabled = true;
    } else {
      pFilter.innerHTML = htmlAll;
      pFilter.disabled = false;
    }
    fPartner.innerHTML = htmlOnly;
    pModal.innerHTML = htmlOnly;
  }

  function statusClass(st) {
    if (st === '입고·견적 대기') return 'st-wait';
    if (st === '판금 진행' || st === '도장 진행') return 'st-work';
    return 'st-done';
  }

  function render() {
    $('modeBadge').textContent = role === 'PARTNER' ? ('거래처 모드 · ' + activePartner) : '관리자 모드';
    $('modeBadge').className = role === 'PARTNER' ? 'pill partner' : 'pill mode';

    var base = role === 'PARTNER' && activePartner
      ? vehicles.filter(function(v) { return v.partner === activePartner; })
      : vehicles;

    $('cntAll').textContent = base.length;
    $('cntWait').textContent = base.filter(function(v) { return v.status === '입고·견적 대기'; }).length;
    $('cntMetal').textContent = base.filter(function(v) { return v.status === '판금 진행'; }).length;
    $('cntPaint').textContent = base.filter(function(v) { return v.status === '도장 진행'; }).length;
    $('cntDone').textContent = base.filter(function(v) { return v.status === '출고 대기·완료'; }).length;

    var q = ($('searchInput').value || '').trim().toLowerCase();
    var pVal = $('partnerFilter').value;
    var sVal = $('statusFilterSelect').value;

    var filtered = base.filter(function(v) {
      if (statusFilter !== 'ALL' && v.status !== statusFilter) return false;
      if (sVal !== 'ALL' && v.status !== sVal) return false;
      if (role !== 'PARTNER' && pVal !== 'ALL' && v.partner !== pVal) return false;
      if (q) {
        var text = [v.plate, v.model, v.customer, v.insurance, v.tech, v.partner, v.memo].join(' ').toLowerCase();
        if (text.indexOf(q) === -1) return false;
      }
      return true;
    });

    $('resultCount').textContent = '조회된 차량: ' + filtered.length + '대';

    var listEl = $('vehicleList');
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty-box">조회된 차량이 없습니다.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(function(v) {
      return (
        '<article class="v-card">' +
          '<div class="v-top">' +
            '<div>' +
              '<span class="pill partner">' + v.partner + '</span> ' +
              '<span class="pill type">' + v.type + '</span>' +
              '<div class="v-plate">' + v.plate + '</div>' +
              '<div class="v-model">' + v.model + '</div>' +
            '</div>' +
            '<span class="pill ' + statusClass(v.status) + '">' + v.status + '</span>' +
          '</div>' +
          '<div class="v-meta">' +
            '<div><strong>고객:</strong> ' + (v.customer || '-') + ' (' + (v.phone || '-') + ')</div>' +
            '<div><strong>담당:</strong> ' + (v.tech || '-') + '</div>' +
            '<div><strong>보험사:</strong> ' + (v.insurance || '-') + '</div>' +
