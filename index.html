<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="application-name" content="ACRO 공업사">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ACRO 공업사">
<title>ACRO MOTORS · 아크로 공업사 차량 입고·정비 관리</title>
<link id="appleTouchIconLink" rel="apple-touch-icon" href="">
<link id="manifestLink" rel="manifest" href="">
<style>
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-2: #f9fafb;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #111827;
    --primary-ink: #ffffff;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --ok: #059669;
    --ok-soft: #ecfdf5;
    --warn: #d97706;
    --warn-soft: #fffbeb;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 2px 10px rgba(0,0,0,0.05);
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: rgba(37, 99, 235, 0.22);
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    position: relative;
  }
  .app-wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 12px;
    padding-bottom: 92px;
    position: relative;
    z-index: 1;
  }

  /* Header Card */
  .top-header {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    position: relative;
    z-index: 2;
  }
  .brand-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    min-width: 0;
  }
  .acro-box {
    background: #111827;
    color: #ffffff;
    padding: 6px 10px;
    border-radius: 8px;
    text-align: center;
    line-height: 1.1;
    flex-shrink: 0;
  }
  .acro-box .en {
    display: block;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: #ef4444;
  }
  .acro-box .sub {
    display: block;
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: #e5e7eb;
    margin-top: 2px;
  }
  .brand-info {
    min-width: 0;
    flex: 1;
  }
  .brand-title-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .brand-name {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
  }
  .mode-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid #bfdbfe;
  }
  .mode-pill.partner {
    background: var(--warn-soft);
    color: var(--warn);
    border-color: #fde68a;
  }
  .sync-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--ok-soft);
    color: var(--ok);
    border: 1px solid #a7f3d0;
  }
  .brand-desc {
    margin: 3px 0 0 0;
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .btn-row-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 7px;
    margin-bottom: 7px;
    position: relative;
    z-index: 3;
  }
  .btn-row-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
    position: relative;
    z-index: 3;
  }

  button, select, input, textarea {
    font-family: inherit;
    font-size: 14px;
    max-width: 100%;
  }
  button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 42px;
    font-size: 12.5px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    pointer-events: auto;
    position: relative;
    z-index: 4;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button:active { transform: scale(0.99); opacity: 0.9; }
  button.primary {
    background: var(--primary);
    color: var(--primary-ink);
    border-color: var(--primary);
  }
  button.accent {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  button.soft-gray {
    background: #f3f4f6;
    color: #1f2937;
    border-color: #e5e7eb;
  }
  button.danger-soft {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: #fecaca;
  }
  button.small {
    min-height: 36px;
    padding: 5px 9px;
    font-size: 12px;
  }

  input[type="text"], input[type="tel"], input[type="date"], input[type="password"], select, textarea {
    width: 100%;
    border: 1px solid #d1d5db;
    background: #fff;
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    min-height: 42px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  textarea {
    min-height: 76px;
    resize: vertical;
  }

  /* Stats Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 12px;
    position: relative;
    z-index: 2;
  }
  @media (min-width: 720px) {
    .stats-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 12px;
    box-shadow: var(--shadow);
    cursor: pointer;
    min-width: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    pointer-events: auto;
    position: relative;
    z-index: 3;
  }
  .stat-card.active {
    border: 1.5px solid #3b82f6;
    background: #f8faff;
  }
  .stat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 6px;
    gap: 4px;
  }
  .stat-num {
    font-size: 24px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.15;
    margin-bottom: 6px;
  }
  .stat-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }
  .stat-card.active .stat-bottom {
    color: var(--accent);
    font-weight: 700;
  }
  .stat-sub {
    font-size: 11.5px;
    color: var(--muted);
  }

  /* Filter Card */
  .filter-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    z-index: 2;
  }
  .filter-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  @media (min-width: 640px) {
    .filter-row.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  .filter-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
    padding-top: 2px;
  }
  .link-btn {
    background: none;
    border: none;
    min-height: 32px;
    padding: 2px 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }
  .link-btn.muted {
    color: #4b5563;
  }

  /* Vehicle List & Cards */
  .vehicle-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    z-index: 2;
  }
  .v-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .v-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .v-badges {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .v-plate {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .v-model {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
  }
  .pill.partner { background: #eff6ff; color: #1d4ed8; }
  .pill.type { background: #f3f4f6; color: #374151; }
  .pill.rental { background: #fef3c7; color: #92400e; }
  .pill.st-wait { background: #fff7ed; color: #c2410c; }
  .pill.st-work { background: #eff6ff; color: #1d4ed8; }
  .pill.st-done { background: #ecfdf5; color: #047857; }

  .v-meta {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px;
    font-size: 12.5px;
    color: #374151;
    background: var(--surface-2);
    padding: 9px 10px;
    border-radius: var(--radius-sm);
  }
  @media (min-width: 640px) {
    .v-meta {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  .damage-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .d-tag {
    font-size: 11px;
    font-weight: 600;
    background: #f1f5f9;
    color: #0f172a;
    border: 1px solid #cbd5e1;
    padding: 2px 7px;
    border-radius: 6px;
  }
  .v-memo {
    font-size: 12.5px;
    color: #374151;
    white-space: pre-line;
  }
  .v-photos-preview {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .thumb-box {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line);
    position: relative;
    background: #f3f4f6;
    cursor: pointer;
  }
  .thumb-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb-tag {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(17,24,39,0.78);
    color: #fff;
    font-size: 9.5px;
    text-align: center;
    padding: 1px 0;
  }
  .thumb-tag.cond {
    background: rgba(5,150,105,0.85);
  }
  .v-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  @media (min-width: 640px) {
    .v-actions {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }

  /* Damage Selector Chips */
  .damage-picker {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    margin-top: 6px;
  }
  @media (min-width: 640px) {
    .damage-picker {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }
  .dmg-btn {
    min-height: 38px;
    padding: 6px 8px;
    font-size: 12px;
    justify-content: flex-start;
    background: #fff;
    color: #1f2937;
    border: 1px solid #d1d5db;
  }
  .dmg-btn.selected {
    background: #111827;
    color: #ffffff;
    border-color: #111827;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.52);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
    z-index: 9999;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-backdrop.open {
    display: flex;
  }
  .modal-box {
    background: var(--surface);
    border-radius: var(--radius);
    width: 100%;
    max-width: 660px;
    max-height: 90vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .modal-title {
    font-size: 16px;
    font-weight: 800;
    margin: 0;
  }
  .form-group {
    margin-bottom: 11px;
  }
  .form-label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    margin-bottom: 4px;
    color: #1f2937;
  }
  .photo-zone {
    border: 1.5px dashed #9ca3af;
    border-radius: var(--radius-sm);
    padding: 10px;
    background: var(--surface-2);
    margin-bottom: 10px;
  }
  .photo-zone.after {
    border-color: #60a5fa;
    background: #f8faff;
  }
  .photo-zone.condition {
    border-color: #34d399;
    background: #f0fdf4;
  }
  .photo-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .photo-count {
    font-size: 11.5px;
    font-weight: 700;
    color: #374151;
  }
  .upload-status-text {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--accent);
    margin-top: 4px;
  }
  .photo-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .photo-item {
    position: relative;
    width: 72px;
    height: 72px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #fff;
  }
  .photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
