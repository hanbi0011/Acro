<div class="modal-head">
      <h3 class="modal-title">☁️ 구글 시트 동기화 설정</h3>
      <button type="button" class="small" data-close-modal="syncModal">닫기 ✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Google Apps Script 웹 앱 URL</label>
      <input type="text" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
      <div class="photo-hint">비워두면 브라우저(localStorage) 기준으로 단독 동작합니다.</div>
    </div>
    <div class="form-group">
      <label class="form-label">거래처 접속 코드 안내</label>
      <table class="code-table">
        <thead>
          <tr><th>거래처</th><th>접속 코드</th></tr>
        </thead>
        <tbody id="partnerCodeTableBody"></tbody>
      </table>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">
      <button type="button" id="btnTestSync">연결/동기화 실행</button>
      <button type="button" id="btnSaveSync" class="primary">설정 저장</button>
    </div>
  </div>
</div>

<div id="photoViewerModal" class="modal-backdrop">
  <div class="modal-box" style="max-width:780px;text-align:center;">
    <div class="modal-head">
      <h3 id="photoViewerTitle" class="modal-title">사진 보기</h3>
      <button type="button" class="small" data-close-modal="photoViewerModal">닫기 ✕</button>
    </div>
    <img id="photoViewerImg" src="" alt="미리보기" style="max-width:100%;max-height:70vh;border-radius:10px;object-fit:contain;">
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  const STORAGE_KEY = 'ACRO_MOTORS_VEHICLES_V1';
  const SYNC_KEY = 'ACRO_MOTORS_SYNC_CONFIG_V1';
  const ADMIN_PIN = 'ACRO-0000';

  const PARTNERS = [
    { id: 'ALL', name: '전체 거래처', code: '' },
    { id: 'BYD_CJ', name: 'BYD 천안·청주', code: 'ACRO-BYD-CJ' },
    { id: 'GENERAL', name: '일반/개별 입고', code: 'ACRO-GEN-01' },
    { id: 'INS_DIRECT', name: '보험사/협력업체', code: 'ACRO-INS-02' }
  ];

  const DAMAGE_PARTS = [
    '앞범퍼', '뒷범퍼', '본넷', '트렁크',
    '좌측 앞문', '좌측 뒷문', '우측 앞문', '우측 뒷문',
    '좌측 앞휀더', '좌측 뒷휀더', '우측 앞휀더', '우측 뒷휀더',
    '루프/선루프', '헤드램프/테일램프', '휠/타이어/하체'
  ];

  const SAMPLE_VEHICLES = [
    {
      id: 'v-101',
      partner: 'BYD_CJ',
      type: '보험수리',
      plate: '219하 4410',
      model: 'BYD 아토 3',
      customer: '김민수',
      phone: '010-2345-6789',
      insurance: '삼성화재',
      claimNo: '2026-88412',
      rental: true,
      rentalInfo: '아반떼 CN7 (대차 배차완료)',
      status: '판금 진행',
      tech: '판금부 최성윤 팀장',
      dueDate: '2026-11-28',
      estimate: '1,450,000',
      damages: ['앞범퍼', '우측 앞휀더', '헤드램프/테일램프'],
      memo: '우측 전방 추돌, 범퍼 브라켓 및 휀더 단차 교정 필요.',
      photos: { condition: [], before: [], after: [] },
      updatedAt: '2026-11-24 09:30'
    },
    {
      id: 'v-102',
      partner: 'GENERAL',
      type: '판금·도장',
      plate: '5921',
      model: '제네시스 G80',
      customer: '이서준',
      phone: '010-8765-4321',
      insurance: '',
      claimNo: '',
      rental: false,
      rentalInfo: '',
      status: '도장 진행',
      tech: '도장부 강신철',
      dueDate: '2026-11-26',
      estimate: '680,000',
      damages: ['좌측 뒷문', '좌측 뒷휀더'],
      memo: '주차 중 문콕 및 스침 스크래치 부분 판금 후 열처리 도장 예정.',
      photos: { condition: [], before: [], after: [] },
      updatedAt: '2026-11-24 11:15'
    }
  ];

  let state = {
    mode: 'ADMIN', // 'ADMIN' | 'PARTNER'
    activePartner: 'ALL',
    statusFilter: 'ALL',
    search: '',
    partnerFilter: 'ALL',
    typeFilter: 'ALL',
    rentalFilter: 'ALL',
    vehicles: [],
    syncConfig: { gasUrl: '' },
    draftPhotos: { condition: [], before: [], after: [] },
    selectedDamages: []
  };

  const $ = (id) => document.getElementById(id);

  function showToast(msg) {
    const el = $('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  function loadData() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) state.vehicles = parsed;
      } else {
        state.vehicles = JSON.parse(JSON.stringify(SAMPLE_VEHICLES));
        saveVehicles();
      }
    } catch (e) {
      state.vehicles = JSON.parse(JSON.stringify(SAMPLE_VEHICLES));
    }

    try {
      const syncSaved = localStorage.getItem(SYNC_KEY);
      if (syncSaved) state.syncConfig = JSON.parse(syncSaved);
    } catch (e) {}

    updateSyncBadge();
  }

  function saveVehicles() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.vehicles));
    } catch (e) {
      showToast('브라우저 저장 공간 한도를 초과했습니다.');
    }
  }

  function updateSyncBadge() {
    const badge = $('syncStatusBadge');
    if (!badge) return;
    if (state.syncConfig && state.syncConfig.gasUrl && state.syncConfig.gasUrl.trim()) {
      badge.textContent = '☁️ 시트 연동됨';
    } else {
      badge.textContent = '⚡ 동기화 대기';
    }
  }

  function getPartnerName(id) {
    const found = PARTNERS.find(p => p.id === id);
    return found ? found.name : id;
  }

  function populateSelects() {
    const partnerFilter = $('partnerFilter');
    if (partnerFilter) {
      partnerFilter.innerHTML = PARTNERS.map(p =>
        `<option value="${p.id}">${p.id === 'ALL' ? '의뢰 거래처: 전체' : p.name}</option>`
      ).join('');
      partnerFilter.value = state.partnerFilter;
    }

    const fPartner = $('fPartner');
    if (fPartner) {
      fPartner.innerHTML = PARTNERS.filter(p => p.id !== 'ALL').map(p =>
        `<option value="${p.id}">${p.name}</option>`
      ).join('');
    }

    const partnerAuthSelect = $('partnerAuthSelect');
    if (partnerAuthSelect) {
      partnerAuthSelect.innerHTML = PARTNERS.filter(p => p.id !== 'ALL').map(p =>
        `<option value="${p.id}">${p.name}</option>`
      ).join('');
    }

    const codeBody = $('partnerCodeTableBody');
    if (codeBody) {
      codeBody.innerHTML = PARTNERS.filter(p => p.id !== 'ALL').map(p =>
        `<tr><td>${p.name}</td><td><code>${p.code}</code></td></tr>`
      ).join('');
    }
  }

  function renderDamagePicker() {
    const picker = $('damagePicker');
    if (!picker) return;
    picker.innerHTML = DAMAGE_PARTS.map(part => {
      const active = state.selectedDamages.includes(part);
      return `<button type="button" class="dmg-btn ${active ? 'selected' : ''}" data-dmg="${part}">${active ? '✓ ' : ''}${part}</button>`;
    }).join('');

    picker.querySelectorAll('.dmg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const part = btn.getAttribute('data-dmg');
        if (state.selectedDamages.includes(part)) {
          state.selectedDamages = state.selectedDamages.filter(x => x !== part);
        } else {
          state.selectedDamages.push(part);
        }
        renderDamagePicker();
      });
    });
  }

  function getFilteredVehicles() {
    const q = (state.search || '').trim().toLowerCase();
    return state.vehicles.filter(v => {
      if (state.mode === 'PARTNER' && state.activePartner !== 'ALL' && v.partner !== state.activePartner) {
        return false;
      }
      if (state.partnerFilter !== 'ALL' && v.partner !== state.partnerFilter) {
        return false;
      }
      if (state.statusFilter !== 'ALL' && v.status !== state.statusFilter) {
        return false;
      }
      if (state.typeFilter !== 'ALL' && v.type !== state.typeFilter) {
        return false;
      }
      if (state.rentalFilter === 'RENTAL' && !v.rental) return false;
      if (state.rentalFilter === 'NO_RENTAL' && v.rental) return false;

      if (q) {
        const hay = [
          v.plate, v.model, v.customer, v.phone,
          v.insurance, v.claimNo, v.tech, v.memo, getPartnerName(v.partner)
        ].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function updateStats() {
    const baseList = state.vehicles.filter(v =>
      state.mode === 'PARTNER' && state.activePartner !== 'ALL' ? v.partner === state.activePartner : true
    );
    $('cnt-ALL').textContent = baseList.length;
    $('cnt-WAIT').textContent = baseList.filter(v => v.status === '입고·견적 대기').length;
    $('cnt-METAL').textContent = baseList.filter(v => v.status === '판금 진행').length;
    $('cnt-PAINT').textContent = baseList.filter(v => v.status === '도장 진행').length;
    $('cnt-DONE').textContent = baseList.filter(v => v.status === '출고 대기·완료').length;

    document.querySelectorAll('.stat-card').forEach(card => {
      card.classList.toggle('active', card.getAttribute('data-status') === state.statusFilter);
    });
  }

  function getStatusPillClass(status) {
    if (status === '입고·견적 대기') return 'st-wait';
    if (status === '출고 대기·완료') return 'st-done';
    return 'st-work';
  }

  function renderVehicles() {
    updateStats();
    const listEl = $('vehicleList');
    const filtered = getFilteredVehicles();
    $('resultCountText').textContent = `조회된 차량: ${filtered.length}대`;

    if (!filtered.length) {
      listEl.innerHTML = `<div class="empty-box">조건에 맞는 입고 차량이 없습니다.<br>새 차량을 등록하거나 필터를 초기화해 보세요.</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(v => {
      const dmgHtml = (v.damages && v.damages.length)
        ? `<div class="damage-tags">${v.damages.map(d => `<span class="d-tag">${d}</span>`).join('')}</div>`
        : '';

      const allPhotos = [
        ...(v.photos?.condition || []).map((src, i) => ({ src, tag: `컨디션 ${i + 1}` })),
        ...(v.photos?.before || []).map((src, i) => ({ src, tag: `작업전 ${i + 1}` })),
        ...(v.photos?.after || []).map((src, i) => ({ src, tag: `작업후 ${i + 1}` }))
      ];

      const photoHtml = allPhotos.length
        ? `<div class="v-photos-preview">${allPhotos.map(p =>
            `<div class="thumb-box" data-view-src="${p.src}" data-view-tag="${v.plate} - ${p.tag}">
              <img src="${p.src}" alt="${p.tag}">
              <span class="thumb-tag">${p.tag}</span>
            </div>`
          ).join('')}</div>`
        : '';

      const isAdmin = state.mode === 'ADMIN';
      const actionHtml = isAdmin
        ? `<div class="v-actions">
            <button type="button" class="small" data-action="cycle" data-id="${v.id}">🔄 공정 변경</button>
            <button type="button" class="small" data-action="edit" data-id="${v.id}">✏️ 수정</button>
            <button type="button" class="small soft-gray" data-action="print" data-id="${v.id}">🖨️ 인쇄</button>
            <button type="button" class="small danger-soft" data-action="delete" data-id="${v.id}">🗑️ 삭제</button>
          </div>`
        : `<div class="v-actions">
            <button type="button" class="small soft-gray" data-action="print" data-id="${v.id}" style="grid-column: span 2;">🖨️ 정비 현황 인쇄</button>
          </div>`;

      return `
        <article class="v-card">
          <div class="v-top">
            <div>
              <div class="v-badges">
                <span class="pill ${getStatusPillClass(v.status)}">${v.status}</span>
                <span class="pill partner">${getPartnerName(v.partner)}</span>
                <span class="pill type">${v.type}</span>
                ${v.rental ? `<span class="pill rental">🚗 대차 신청${v.rentalInfo ? ` (${v.rentalInfo})` : ''}</span>` : ''}
              </div>
              <div class="v-plate">${v.plate} <span class="v-model">· ${v.model}</span></div>
            </div>
          </div>
          <div class="v-meta">
            <div><strong>고객:</strong> ${v.customer || '-'} ${v.phone ? `(${v.phone})` : ''}</div>
            <div><strong>담당:</strong> ${v.tech || '-'}</div>
            <div><strong>보험/접수:</strong> ${v.insurance || '-'} ${v.claimNo ? `/ ${v.claimNo}` : ''}</div>
            <div><strong>출고예정 / 예상액:</strong> ${v.dueDate || '-'} / ${v.estimate ? `${v.estimate}원` : '-'}</div>
          </div>
          ${dmgHtml}
          ${v.memo ? `<div class="v-memo">${v.memo}</div>` : ''}
          ${photoHtml}
          ${actionHtml}
        </article>
      `;
    }).join('');

    listEl.querySelectorAll('.thumb-box').forEach(box => {
      box.addEventListener('click', () => {
        $('photoViewerTitle').textContent = box.getAttribute('data-view-tag') || '사진 보기';
        $('photoViewerImg').src = box.getAttribute('data-view-src');
        openModal('photoViewerModal');
      });
    });

    listEl.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const action = btn.getAttribute('data-action');
        if (action === 'cycle') cycleVehicleStatus(id);
        if (action === 'edit') openVehicleModal(id);
        if (action === 'delete') deleteVehicle(id);
        if (action === 'print') window.print();
      });
    });
  }

  function cycleVehicleStatus(id) {
    const order = ['입고·견적 대기', '판금 진행', '도장 진행', '출고 대기·완료'];
    const target = state.vehicles.find(v => v.id === id);
    if (!target) return;
    const idx = order.indexOf(target.status);
    target.status = order[(idx + 1) % order.length];
    target.updatedAt = new Date().toISOString().slice(0, 16).replace('T', ' ');
    saveVehicles();
    renderVehicles();
    showToast(`${target.plate} → ${target.status}`);
  }

  function deleteVehicle(id) {
    const target = state.vehicles.find(v => v.id === id);
    if (!target) return;
    if (!confirm(`${target.plate} (${target.model}) 입고 내역을 삭제할까요?`)) return;
    state.vehicles = state.vehicles.filter(v => v.id !== id);
    saveVehicles();
    renderVehicles();
    showToast('차량 내역이 삭제되었습니다.');
  }

  function renderPhotoPreviews() {
    const map = [
      { key: 'condition', elId: 'conditionPhotoPreview' },
      { key: 'before', elId: 'beforePhotoPreview' },
      { key: 'after', elId: 'afterPhotoPreview' }
    ];
    map.forEach(({ key, elId }) => {
      const container = $(elId);
      if (!container) return;
      const arr = state.draftPhotos[key] || [];
      container.innerHTML = arr.map((src, idx) => `
        <div class="photo-item">
          <img src="${src}" alt="${key}-${idx}">
          <button type="button" class="photo-del" data-p-key="${key}" data-p-idx="${idx}">✕</button>
        </div>
      `).join('');

      container.querySelectorAll('.photo-del').forEach(btn => {
        btn.addEventListener('click', () => {
          const k = btn.getAttribute('data-p-key');
          const i = Number(btn.getAttribute('data-p-idx'));
          state.draftPhotos[k].splice(i, 1);
          renderPhotoPreviews();
        });
      });
    });
  }

  function handlePhotoInput(inputId, key) {
    const input = $(inputId);
    if (!input) return;
    input.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      const remain = 10 - state.draftPhotos[key].length;
      if (remain <= 0) {
        showToast('사진은 최대 10장까지 등록할 수 있습니다.');
        input.value = '';
        return;
      }
      const chosen = files.slice(0, remain);
      chosen.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          state.draftPhotos[key].push(ev.target.result);
          renderPhotoPreviews();
        };
        reader.readAsDataURL(file);
      });
      input.value = '';
    });
  }

  function openVehicleModal(editId = null) {
    if (state.mode !== 'ADMIN') {
      showToast('관리자 모드에서만 차량을 등록·수정할 수 있습니다.');
      return;
    }
    const form = $('vehicleForm');
    form.reset();
    $('fRentalInfo').style.display = 'none';

    if (editId) {
      const v = state.vehicles.find(x => x.id === editId);
      if (!v) return;
      $('vehicleModalTitle').textContent = `차량 수정 · ${v.plate}`;
      $('editVehicleId').value = v.id;
      $('fPartner').value = v.partner || 'GENERAL';
      $('fType').value = v.type || '보험수리';
      $('fPlate').value = v.plate || '';
      $('fModel').value = v.model || '';
      $('fCustomer').value = v.customer || '';
      $('fPhone').value = v.phone || '';
      $('fInsurance').value = v.insurance || '';
      $('fClaimNo').value = v.claimNo || '';
      $('fRental').checked = !!v.rental;
      $('fRentalInfo').style.display = v.rental ? 'block' : 'none';
      $('fRentalInfo').value = v.rentalInfo || '';
      $('fStatus').value = v.status || '입고·견적 대기';
      $('fTech').value = v.tech || '판금부 최성윤 팀장';
      $('fDueDate').value = v.dueDate || '';
      $('fEstimate').value = v.estimate || '';
      $('fMemo').value = v.memo || '';
      state.selectedDamages = Array.isArray(v.damages) ? [...v.damages] : [];
      state.draftPhotos = {
        condition: [...(v.photos?.condition || [])],
        before: [...(v.photos?.before || [])],
        after: [...(v.photos?.after || [])]
      };
    } else {
      $('vehicleModalTitle').textContent = '신규 차량 입고';
      $('editVehicleId').value = '';
      state.selectedDamages = [];
      state.draftPhotos = { condition: [], before: [], after: [] };
    }

    renderDamagePicker();
    renderPhotoPreviews();
    openModal('vehicleModal');
  }

  function openModal(id) {
    const el = $(id);
    if (el) el.classList.add('open');
  }

  function closeModal(id) {
    const el = $(id);
    if (el) el.classList.remove('open');
  }

  function updateModeUI() {
    const badge = $('modeBadge');
    const banner = $('partnerReadOnlyBanner');
    const btnAdmin = $('btnAdminMode');
    const btnPartner = $('btnPartnerMode');
    const btnNew = $('btnNewVehicle');

    if (state.mode === 'ADMIN') {
      badge.textContent = '관리자 모드';
      badge.classList.remove('partner');
      banner.classList.remove('show');
      btnAdmin.className = 'primary';
      btnPartner.className = 'soft-gray';
      btnNew.disabled = false;
    } else {
      const pName = getPartnerName(state.activePartner);
      badge.textContent = `거래처 모드 · ${pName}`;
      badge.classList.add('partner');
      banner.textContent = `현재 [${pName}] 조회 전용 모드로 열려 있습니다. 등록/수정/삭제는 관리자 모드로 전환해 주세요.`;
      banner.classList.add('show');
      btnAdmin.className = 'soft-gray';
      btnPartner.className = 'primary';
      btnNew.disabled = true;
    }
    renderVehicles();
  }

  function bindEvents() {
    document.querySelectorAll('[data-close-modal]').forEach(btn => {
      btn.addEventListener('click', () => closeModal(btn.getAttribute('data-close-modal')));
    });

    document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) backdrop.classList.remove('open');
      });
    });

    $('btnAdminMode').addEventListener('click', () => {
      if (state.mode === 'ADMIN') {
        showToast('이미 관리자 모드입니다.');
        return;
      }
      $('adminPinInput').value = '';
      openModal('adminModal');
    });

    $('btnConfirmAdmin').addEventListener('click', () => {
      const pin = ($('adminPinInput').value || '').trim();
      if (pin !== ADMIN_PIN && pin !== '') {
        showToast('관리자 PIN이 일치하지 않습니다. (초기값: ACRO-0000)');
        return;
      }
      state.mode = 'ADMIN';
      state.activePartner = 'ALL';
      closeModal('adminModal');
      updateModeUI();
      showToast('관리자 모드로 전환되었습니다.');
    });

    $('btnPartnerMode').addEventListener('click', () => {
      $('partnerPinInput').value = '';
      openModal('partnerModal');
    });

    $('btnSwitchPartner').addEventListener('click', () => {
      const selectedId = $('partnerAuthSelect').value;
      const partnerObj = PARTNERS.find(p => p.id === selectedId);
      const code = ($('partnerPinInput').value || '').trim();
      if (code && partnerObj && code !== partnerObj.code) {
        showToast(`접속 코드가 일치하지 않습니다. (예시 코드: ${partnerObj.code})`);
        return;
      }
      state.mode = 'PARTNER';
      state.activePartner = selectedId;
      state.partnerFilter = selectedId;
      $('partnerFilter').value = selectedId;
      closeModal('partnerModal');
      updateModeUI();
      showToast(`${partnerObj ? partnerObj.name : '거래처'} 모드로 전환되었습니다.`);
    });

    $('btnSyncCode').addEventListener('click', () => {
      $('gasUrlInput').value = state.syncConfig.gasUrl || '';
      openModal('syncModal');
    });

    $('btnSaveSync').addEventListener('click', () => {
      state.syncConfig.gasUrl = ($('gasUrlInput').value || '').trim();
      localStorage.setItem(SYNC_KEY, JSON.stringify(state.syncConfig));
      updateSyncBadge();
      closeModal('syncModal');
      showToast('동기화 설정이 저장되었습니다.');
    });

    $('btnTestSync').addEventListener('click', async () => {
      const url = ($('gasUrlInput').value || '').trim();
      state.syncConfig.gasUrl = url;
      localStorage.setItem(SYNC_KEY, JSON.stringify(state.syncConfig));
      updateSyncBadge();
      if (!url) {
        showToast('로컬 저장소(localStorage) 기준으로 최신 상태가 유지됩니다.');
        return;
      }
      try {
        showToast('구글 시트 연결 확인 중...');
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'ping', count: state.vehicles.length })
        });
        showToast('동기화 요청을 전송했습니다.');
      } catch (err) {
        showToast('연결 중 오류가 발생했습니다. URL을 확인해 주세요.');
      }
    });

    $('btnSaveHtml').addEventListener('click', () => {
      const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ACRO_MOTORS_${new Date().toISOString().slice(0, 10)}.html`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('.html 파일이 다운로드되었습니다.');
    });

    $('btnNewVehicle').addEventListener('click', () => openVehicleModal(null));

    $('fRental').addEventListener('change', (e) => {
      $('fRentalInfo').style.display = e.target.checked ? 'block' : 'none';
    });

    $('vehicleForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (state.mode !== 'ADMIN') return;

      const editId = $('editVehicleId').value;
      const record = {
        id: editId || ('v-' + Date.now()),
        partner: $('fPartner').value,
        type: $('fType').value,
        plate: $('fPlate').value.trim(),
        model: $('fModel').value.trim(),
        customer: $('fCustomer').value.trim(),
        phone: $('fPhone').value.trim(),
        insurance: $('fInsurance').value.trim(),
        claimNo: $('fClaimNo').value.trim(),
        rental: $('fRental').checked,
        rentalInfo: $('fRental').checked ? $('fRentalInfo').value.trim() : '',
        status: $('fStatus').value,
        tech: $('fTech').value,
        dueDate: $('fDueDate').value,
        estimate: $('fEstimate').value.trim(),
        damages: [...state.selectedDamages],
        memo: $('fMemo').value.trim(),
        photos: {
          condition: [...state.draftPhotos.condition],
          before: [...state.draftPhotos.before],
          after: [...state.draftPhotos.after]
        },
        updatedAt: new Date().toISOString().slice(0, 16).replace('T', ' ')
      };

      if (!record.plate || !record.model) {
        showToast('차량번호와 차종을 입력해 주세요.');
        return;
      }

      if (editId) {
        const idx = state.vehicles.findIndex(x => x.id === editId);
        if (idx > -1) state.vehicles[idx] = record;
        showToast(`${record.plate} 정보가 수정되었습니다.`);
      } else {
        state.vehicles.unshift(record);
        showToast(`${record.plate} 차량이 입고 등록되었습니다.`);
      }

      saveVehicles();
      renderVehicles();
      closeModal('vehicleModal');
    });

    document.querySelectorAll('.stat-card').forEach(card => {
      card.addEventListener('click', () => {
        state.statusFilter = card.getAttribute('data-status') || 'ALL';
        renderVehicles();
      });
    });

    $('searchInput').addEventListener('input', (e) => {
      state.search = e.target.value;
      renderVehicles();
    });

    $('partnerFilter').addEventListener('change', (e) => {
      state.partnerFilter = e.target.value;
      renderVehicles();
    });

    $('typeFilter').addEventListener('change', (e) => {
      state.typeFilter = e.target.value;
      renderVehicles();
    });

    $('rentalFilter').addEventListener('change', (e) => {
      state.rentalFilter = e.target.value;
      renderVehicles();
    });

    $('btnResetFilters').addEventListener('click', () => {
      state.statusFilter = 'ALL';
      state.search = '';
      state.partnerFilter = state.mode === 'PARTNER' ? state.activePartner : 'ALL';
      state.typeFilter = 'ALL';
      state.rentalFilter = 'ALL';
      $('searchInput').value = '';
      $('partnerFilter').value = state.partnerFilter;
      $('typeFilter').value = 'ALL';
      $('rentalFilter').value = 'ALL';
      renderVehicles();
      showToast('필터가 초기화되었습니다.');
    });

    $('btnRestoreSample').addEventListener('click', () => {
      if (!confirm('초기 샘플 데이터로 복원하시겠습니까?')) return;
      state.vehicles = JSON.parse(JSON.stringify(SAMPLE_VEHICLES));
      saveVehicles();
      renderVehicles();
      showToast('초기 샘플 데이터가 복원되었습니다.');
    });

    handlePhotoInput('conditionPhotoInput', 'condition');
    handlePhotoInput('beforePhotoInput', 'before');
    handlePhotoInput('afterPhotoInput', 'after');
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadData();
    populateSelects();
    bindEvents();
    updateModeUI();
  });
})();
</script>
</body>
</html>
